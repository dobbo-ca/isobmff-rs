name: ci
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The checks run inside .github/ci/Dockerfile on the in-cluster BuildKit, so the Rust image and the
  # build cache stay in the cluster. The crate has no dependencies and no private git deps, so no job
  # needs a token. The layers are also saved to the Actions cache (one scope per job), so a restart
  # of buildkitd does not throw them away.
  # A PR needs only `test`; arm64, parity and parity-arm64 run on main and on workflow_dispatch.
  test:
    runs-on: github-arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: ci
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=isobmff-rs-test
          # Only main and dispatch runs export: a PR's cache is scoped to its ref, so no other PR
          # could read it, and the export takes about two minutes.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=isobmff-rs-test' || '' }}

  # The library tests on aarch64 under qemu-user (the parser is portable: one run is enough).
  arm64:
    if: github.event_name != 'pull_request'
    runs-on: github-arc-runner-set
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=isobmff-rs-arm64
          cache-to: type=gha,mode=max,scope=isobmff-rs-arm64

  # libheif and libavif (C oracles) and examples/oracle.rs read the same inputs; the output trees
  # must be equal (tests/parity/run.sh). The stage never fails on a diff: the report is the build
  # output, and the last step fails on its status file.
  parity:
    if: github.event_name != 'pull_request'
    runs-on: github-arc-runner-set
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-report
          push: false
          outputs: type=local,dest=parity-out
          cache-from: type=gha,scope=isobmff-rs-parity
          cache-to: type=gha,mode=max,scope=isobmff-rs-parity
      - if: always()
        run: '[ ! -f parity-out/summary.md ] || cat parity-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity
          path: parity-out
          if-no-files-found: ignore
      - if: always()
        run: exit "$(cat parity-out/status)"
      # The transform oracle (tests/parity/transform.sh): libheif with libde265 and dav1d against
      # isobmff::apply_transforms. Its own report, its own artifact, the same job.
      - if: always()
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: transform-report
          push: false
          outputs: type=local,dest=transform-out
          cache-from: type=gha,scope=isobmff-rs-transform
          cache-to: type=gha,mode=max,scope=isobmff-rs-transform
      - if: always()
        run: '[ ! -f transform-out/summary.md ] || cat transform-out/summary.md >> "$GITHUB_STEP_SUMMARY"'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-transform
          path: transform-out
          if-no-files-found: ignore
      - if: always()
        run: exit "$(cat transform-out/status)"

  # The oracle built for aarch64, run under qemu-user on the libheif and libavif test data,
  # compared with the x86_64 output.
  parity-arm64:
    if: github.event_name != 'pull_request'
    runs-on: github-arc-runner-set
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.github-arc.svc.cluster.local:1234
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: parity-arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=isobmff-rs-parity-arm64
          cache-to: type=gha,mode=max,scope=isobmff-rs-parity-arm64
