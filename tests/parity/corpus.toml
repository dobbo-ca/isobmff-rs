exclude = []
licence = "testFiles/Apple/license.txt: \"Content is subject to CC-BY-SA-4.0 license\"; testFiles/Xiph/COPYING: CC BY-SA 3.0 and CC BY 3.0; testFiles/Microsoft/ReadMe.md: bbb \"Creative Commons Attribution 3.0\""

[[source]]
name = "mpeg-ffc"
repo = "https://github.com/MPEGGroup/FileFormatConformance"
commit = "767a5bcb9fa4841d1b3bb0ca112a6e7d4c6bf067"
