# The public HEIF/AVIF sets of the parity gates (docs/design.md, "Oracles and parity"). Nothing of
# it is committed to this repo. fetch.sh makes one blobless sparse git checkout per [[source]] at
# the pinned `commit` (a SHA, checked after the fetch) into the BuildKit cache mount
# id=isobmff-rs-data, and puts hardlinks of the checked-out files, which are the files selected by
# `include` minus `exclude`, under <dir>/x/<name>/<path in the repo>. `lfs = true` sources also run
# `git lfs pull` for the included paths only.
#
# include / exclude: one line each, a TOML array of git sparse-checkout patterns (gitignore
# syntax). fetch.sh anchors each at the repo root; * does not cross /, ** does.
#
# Counts of files per source at the pinned commit (research of 2026-11-19, from the GitHub API):
# libavif 63, libheif 240, link-u 156, av1-avif 17, mpeg-ffc 61, nokia-conformance-extra 22,
# mp4parse-rust 69, imazen-heic 2, aaron-rust-hdr 4: about 634. run.sh gates on PARITY_MIN_INPUTS
# (default 600).
#
# Not used, on purpose: Netflix and Chimera files of av1-avif (CC BY-NC-ND), libavif
# arc_triomphe_* (CC BY-NC), nokiatech/heif master and heif_conformance (no usable licence),
# imazen testdata/features and testdata/synthetic (AGPL-3.0, undocumented), PhotoPrism, pillow_heif,
# Exiv2, libvips (no licence for the data).

[[source]]
name = "libavif"
repo = "https://github.com/AOMediaCodec/libavif"
commit = "17bdf4c63cb7d84fc9ce4cbf47e94cff3538d93f"
include = ["tests/data/*.avif", "tests/data/io/*.avif"]
exclude = ["tests/data/arc_triomphe_*.avif"]
licence = "BSD-2-Clause. tests/data/README.md:9: \"License: [same as libavif]\"; kodim: \"released by the Eastman Kodak Company for unrestricted usage\"; cosmos1650: CC BY 3.0"

[[source]]
name = "libheif"
repo = "https://github.com/strukturag/libheif"
commit = "12a259a5882dd99d45ec5fc77e296a3b620d1e2e"
include = ["tests/data/*", "examples/*.heic", "examples/*.avif", "fuzzing/data/corpus/*", "fuzzing/data/sequence_corpus/*"]
exclude = []
licence = "COPYING:1-2: \"The library libheif is distributed under the terms of the GNU Lesser General Public License. The sample applications and the Go and C++ wrappers are distributed under the terms of the MIT License.\" (no data-specific grant)"

[[source]]
name = "link-u"
