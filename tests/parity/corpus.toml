exclude = []
licence = "README.md:9: \"Most images are licensed under CC-BY-SA 4.0\"; red-at-12-oclock-*: \"GNU LGPL v2.1 or 2 claused BSD License\""

[[source]]
name = "av1-avif"
repo = "https://github.com/AOMediaCodec/av1-avif"
commit = "bf4c18d1f3971069b75e87d6ee469790589f4f09"
