# Commit on the gh-pages branch of nokiatech/heif, not on its default branch. The conformance
# files that the MPEG repo does not have: C043..C053, C71, MIAF*, and the mini box files C71.heic,
# C75.hmg, C83.hmg, 1dualMiniVVC.hmg (the VVC ones have no explicit codec types: both libheif and
# isobmff-rs reject them; C83_dup.hmg is the same blob as C83.hmg).
[[source]]
name = "nokia-conformance-extra"
repo = "https://github.com/nokiatech/heif"
commit = "f01283f3e64ccc6e6ab489bd556d454879069185"
include = ["content/conformance/C04[3-9].heic", "content/conformance/C05[0-3].heic", "content/conformance/C71.heic", "content/conformance/C75.hmg", "content/conformance/C83.hmg", "content/conformance/1dualMiniVVC.hmg", "content/conformance/MIAF*.heic"]
exclude = []
licence = "CONTENT-LICENSES.md:148-160, section 7: \"Freely redistributable for conformance testing and demonstration.\" (C71.heic, C75.hmg, C83.hmg, 1dualMiniVVC.hmg listed by name)"

[[source]]
